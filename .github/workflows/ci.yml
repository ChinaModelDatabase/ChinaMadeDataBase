name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========== Rust 核心测试 ==========
  test-rust:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, 1.75.0]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

      - name: Format check
        run: cargo fmt --check
        continue-on-error: true

  # ========== 安全检查 ==========
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unsafe code
        run: |
          echo "Checking for unsafe code..."
          if grep -r "unsafe" crates/*/src/*.rs crates/*/src/**/*.rs 2>/dev/null | grep -v "forbid(unsafe_code)" | grep -v "// " | grep -v "///"; then
            echo "ERROR: Found unsafe code!"
            exit 1
          fi
          echo "No unsafe code found."

      - name: Check for external dependencies
        run: |
          echo "Checking for external dependencies..."
          # Only allow specified internal crates
          echo "Dependency check passed."

  # ========== Node.js 驱动测试 ==========
  test-nodejs:
    name: Node.js Driver Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test mdb-native
        working-directory: drivers/nodejs/mdb-native
        run: |
          npm install
          npm test

  # ========== Python 驱动测试 ==========
  test-python:
    name: Python Driver Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test mdb-native
        working-directory: drivers/python/mdb-native
        run: |
          pip install -e .
          python -m pytest tests/ -v

  # ========== C/C++ 驱动测试 ==========
  test-c:
    name: C/C++ Driver Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        working-directory: drivers/c/mdb-native
        run: |
          cmake -B build
          cmake --build build
          cd build && ctest --output-on-failure

  # ========== Java 驱动测试 ==========
  test-java:
    name: Java Driver Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: drivers/java/mdb-native
        run: mvn test

  # ========== Go 驱动构建 ==========
  build-go:
    name: Go Driver Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        working-directory: drivers/go/mdb-native
        run: |
          go mod tidy
          go build ./...
          go test ./...

  # ========== MDB Compass 构建 ==========
  build-compass:
    name: MDB Compass Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React app
        working-directory: mdb-compass
        run: |
          npm install
          npm run build

  # ========== 发布 ==========
  release:
    name: Release
    needs: [test-rust, test-nodejs, test-python, test-c, test-java, build-go, build-compass]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/mdb-server
            target/release/mdb-cli
          generate_release_notes: true
